name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Устанавливаем JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      # 3. Ставим Android SDK
      - name: Install Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: "34.0.0"

      # 4. Разрешаем запуск gradlew
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 5. Собираем APK через Gradle Wrapper
      - name: Build APK
        run: ./gradlew clean assembleDebug

      # 6. Загружаем собранный APK как артефакт
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: core/build/outputs/apk/debug/app-debug.apk
